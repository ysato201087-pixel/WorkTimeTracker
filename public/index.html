<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>作業時間記録</title>
    <meta name="apple-mobile-web-app-title" content="Work Time Tracker">
    <meta name="application-name" content="Work Time Tracker">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" href="/icon-512.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/theme.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="timer-panel" aria-label="タイマー">
        <div class="topline">
          <div>
            <h1>作業時間記録</h1>
            <p id="statusText" class="status idle">未計測</p>
          </div>
          <div class="top-actions">
            <button id="themeButton" class="icon-button theme-button" title="表示モード切り替え" aria-label="表示モード切り替え"></button>
            <button id="openHistoryButton" class="icon-button" title="記録一覧を開く" aria-label="記録一覧を開く">≡</button>
          </div>
        </div>

        <div class="project-combobox category-combobox">
          <input id="categoryInput" class="project-input" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="categoryMenu" placeholder="カテゴリ (なしで未分類)" aria-label="カテゴリ">
          <div id="categoryMenu" class="project-menu" hidden></div>
        </div>
        <div class="project-combobox">
          <input id="projectInput" class="project-input" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="projectMenu" placeholder="プロジェクト" aria-label="プロジェクト">
          <div id="projectMenu" class="project-menu" hidden></div>
        </div>
        <p id="message" class="message" role="status"></p>

        <div class="metric">
          <span>今回の作業時間</span>
          <strong id="currentTime">00:00:00</strong>
        </div>

        <div class="total-row">
          <span id="projectTotalLabel">プロジェクト累計</span>
          <strong id="projectTotal">00:00:00</strong>
        </div>

        <div class="button-grid">
          <button id="startButton" class="primary">スタート</button>
          <button id="pauseButton">一時停止</button>
          <button id="resumeButton">再開</button>
          <button id="stopButton" class="danger">ストップ</button>
        </div>
      </section>
    </main>

    <dialog id="historyDialog" class="history-dialog">
      <div class="dialog-head">
        <h2>記録一覧</h2>
        <button id="closeHistoryButton" class="icon-button" title="閉じる" aria-label="閉じる">×</button>
      </div>

      <div class="history-tools">
        <select id="historyProjectFilter"></select>
        <button id="addEntryButton">手動追加</button>
        <button id="renameProjectButton">編集</button>
        <button id="deleteProjectButton" class="danger">削除</button>
      </div>

      <p id="historyMessage" class="message" role="status"></p>

      <div class="segment" role="tablist">
        <button id="viewEntriesButton" type="button" role="tab">履歴</button>
        <button id="viewDailyButton" type="button" role="tab">日別</button>
      </div>

      <div id="historySummary" class="history-summary"></div>
      <div id="historyList" class="history-list"></div>
    </dialog>

    <dialog id="projectDialog" class="edit-dialog">
      <form id="projectForm" method="dialog">
        <div class="dialog-head">
          <h2 id="projectDialogTitle">編集</h2>
          <button id="cancelProjectButton" type="button" class="icon-button" aria-label="閉じる">×</button>
        </div>
        <label id="projectCategoryLabel">
          カテゴリ
          <input id="projectCategoryInput" type="text" list="categoryList" autocomplete="off" placeholder="なしで未分類">
        </label>
        <label>
          名前
          <input id="projectNameInput" type="text" autocomplete="off" required>
        </label>
        <datalist id="categoryList"></datalist>
        <p id="projectMessage" class="message" role="status"></p>
        <div class="edit-actions">
          <span></span>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="editDialog" class="edit-dialog">
      <form id="editForm" method="dialog">
        <div class="dialog-head">
          <h2 id="editDialogTitle">履歴編集</h2>
          <button id="cancelEditButton" class="icon-button" value="cancel" aria-label="閉じる">×</button>
        </div>

        <input id="editEntryId" type="hidden">
        <label>
          プロジェクト
          <select id="editProjectId"></select>
        </label>
        <label id="durationPresetLabel">
          作業時間を選択
          <select id="durationPreset">
            <option value="900">15分</option>
            <option value="1800">30分</option>
            <option value="2700">45分</option>
            <option value="3600" selected>1時間</option>
            <option value="5400">1時間30分</option>
            <option value="7200">2時間</option>
            <option value="10800">3時間</option>
            <option value="14400">4時間</option>
            <option value="21600">6時間</option>
            <option value="28800">8時間</option>
            <option value="custom">直接入力</option>
          </select>
        </label>
        <label>
          作業時間
          <input id="editActiveText" type="text" inputmode="numeric" placeholder="例: 1時間20分30秒 または 01:20:30" required>
        </label>

        <p id="editMessage" class="message" role="status"></p>
        <div class="edit-actions">
          <button id="deleteEntryButton" type="button" class="danger">履歴削除</button>
          <button id="saveEntryButton" type="submit" class="primary">保存</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
